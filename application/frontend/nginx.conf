# Nginx reverse proxy configuration for MicroTask frontend.
# Serves the React SPA and proxies /api/* and /health/* to the backend API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster page loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Serve React app — all unknown paths return index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend
    # The service name "api" is resolved by Docker Compose / Kubernetes DNS
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy health and metrics endpoints
    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
