# Alembic configuration file
# This file is read by the `alembic` command-line tool.

[alembic]
# Path to migration scripts
script_location = migrations

# SQLAlchemy URL — overridden at runtime by env.py reading environment variables
sqlalchemy.url = mysql+pymysql://user:password@localhost/microtask_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
