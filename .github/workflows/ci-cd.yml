
# ============================================================
# CI/CD Pipeline: Test -> Build -> Push to ECR -> Update GitOps
#
# Triggers:
#   - Push to main branch
#   - Pull requests to main (tests only)
#
# Authentication:
#   AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY GitHub Secrets
#
# No GitHub Actions OIDC.
# No latest image tag.
# ============================================================

name: CI/CD - Build, Test and Push

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 893677555033.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: microtask-app

jobs:

  # ==========================================================
  # JOB 1: TEST API
  # ==========================================================
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            application/api/requirements.txt
            application/tests/requirements-test.txt

      - name: Install test dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run API tests
        working-directory: application
        run: |
          pytest tests/ -v --tb=short

  # ==========================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # Runs only after successful tests on main.
  # ==========================================================
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set image tag
        id: tag
        shell: bash
        run: |
          echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # BUILD API
      # ========================================================
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./application/api
          file: ./application/api/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-${{ steps.tag.outputs.SHA }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-cache,mode=max

      # ========================================================
      # BUILD WORKER
      # ========================================================
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./application/worker
          file: ./application/worker/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-${{ steps.tag.outputs.SHA }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-cache,mode=max

      # ========================================================
      # BUILD FRONTEND
      # ========================================================
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./application/frontend
          file: ./application/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-${{ steps.tag.outputs.SHA }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-cache,mode=max

      # ========================================================
      # UPDATE GITOPS DEVELOPMENT IMAGE TAGS
      # ========================================================
      - name: Update development image tags
        shell: bash
        run: |
          SHA="${{ steps.tag.outputs.SHA }}"

          sed -i -E "s|(^[[:space:]]*tag:[[:space:]]*)api-[^[:space:]]+|\\1api-${SHA}|" helm/microtask/values-eks-dev.yaml
          sed -i -E "s|(^[[:space:]]*tag:[[:space:]]*)worker-[^[:space:]]+|\\1worker-${SHA}|" helm/microtask/values-eks-dev.yaml
          sed -i -E "s|(^[[:space:]]*tag:[[:space:]]*)frontend-[^[:space:]]+|\\1frontend-${SHA}|" helm/microtask/values-eks-dev.yaml

          echo "Updated development image tags:"
          grep -E 'tag: (api|worker|frontend)-' helm/microtask/values-eks-dev.yaml

      # ========================================================
      # COMMIT AND PUSH GITOPS CHANGE
      # ========================================================
      - name: Commit and push GitOps changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/microtask/values-eks-dev.yaml

          if git diff --cached --quiet; then
            echo "No GitOps image tag changes to commit."
          else
            git commit -m "ci: update development image tags to ${{ steps.tag.outputs.SHA }} [skip ci]"
            git push origin HEAD:main
          fi

      # ========================================================
      # SUMMARY
      # ========================================================
      - name: Display published image tags
        run: |
          echo "Successfully published:"
          echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-${{ steps.tag.outputs.SHA }}"
          echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-${{ steps.tag.outputs.SHA }}"
          echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:frontend-${{ steps.tag.outputs.SHA }}"
