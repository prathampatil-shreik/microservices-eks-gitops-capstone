{{- if .Values.mysql.enabled }}
# Dev-only Secret — holds MySQL credentials for the in-cluster database.
# In production this Secret is created by External Secrets Operator; this
# template is skipped entirely (mysql.enabled: false).
#
# WARNING: values-dev.yaml contains placeholder passwords for local use only.
# Never commit real production passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microtask.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ "rootpassword" | b64enc | quote }}
  database: {{ .Values.db.name | b64enc | quote }}
  username: {{ .Values.db.user | b64enc | quote }}
  # Placeholder password for local development only — NOT used in production.
  password: {{ "microtask_pass" | b64enc | quote }}
{{- end }}
