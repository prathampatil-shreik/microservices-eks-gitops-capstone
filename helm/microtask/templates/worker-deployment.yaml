{{- if .Values.components.worker }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microtask.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  # RollingUpdate: replace one pod at a time so processing is never interrupted.
  # maxSurge: 1 allows one extra pod during rollout.
  # maxUnavailable: 0 allows one pod to be down during rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo 'Waiting for database...'
              until nc -z {{ include "microtask.dbHost" . }} {{ .Values.db.port }}; do
                echo 'DB not ready, sleeping 3s...'
                sleep 3
              done
              echo 'Database is reachable.'
      containers:
        - name: worker
          image: {{ include "microtask.image" .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: MYSQL_HOST
              value: {{ include "microtask.dbHost" . | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.db.port | quote }}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.databaseKey }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.usernameKey }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.passwordKey }}
            - name: WORKER_NAME
              value: {{ .Values.worker.workerName | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.worker.pollIntervalSeconds | quote }}
            - name: HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.worker.heartbeatIntervalSeconds | quote }}
            - name: MIN_PROCESSING_SECONDS
              value: {{ .Values.worker.minProcessingSeconds | quote }}
            - name: MAX_PROCESSING_SECONDS
              value: {{ .Values.worker.maxProcessingSeconds | quote }}
            - name: FAILURE_RATE
              value: {{ .Values.worker.failureRate | quote }}
            - name: MAX_RETRIES
              value: {{ .Values.worker.maxRetries | quote }}
          # Readiness: verify the worker script is present AND the Python runtime
          # can import the worker module. The pod is only marked Ready once this
          # passes, preventing traffic routing before the worker is initialised.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import worker; import config; import database"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          # Liveness: confirm the process is still alive. A simpler check than
          # readiness â€” just verify the worker.py file is accessible.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; os.path.exists('/app/worker.py') or exit(1)"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu }}
              memory: {{ .Values.worker.resources.requests.memory }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu }}
              memory: {{ .Values.worker.resources.limits.memory }}
{{- end }}


