# values-prod.yaml — AWS EKS production overrides
# Usage: helm upgrade --install microtask ./helm/microtask -n production -f helm/microtask/values-prod.yaml
#
# SECURITY RULES:
#   - No passwords are stored in this file.
#   - The Secret "microtask-db-secret" is created by External Secrets Operator
#     pulling credentials from AWS Secrets Manager. It must exist before install.
#   - Image tags must be pinned — never use "latest" in production.

# Component flags for production.
# mysql: false — production uses Amazon RDS, no in-cluster MySQL.
# migration: false — migrations are run as a separate controlled step, never on every deploy.
components:
  mysql: false
  api: true
  worker: true
  frontend: true
  migration: false

# Disable in-cluster MySQL — production uses Amazon RDS
mysql:
  enabled: false

# External RDS connection details (no password — comes from ESO Secret)
db:
  host: "microtask-prod-mysql.cqpia4w42h8l.us-east-1.rds.amazonaws.com"
  port: 3306
  name: "microtask_db"
  user: "microtask_app"
  # This Secret is created by External Secrets Operator from AWS Secrets Manager.
  # It must be present in the namespace before helm install/upgrade.
  secretName: "microtask-db-secret"
  passwordKey: "password"
  usernameKey: "username"
  databaseKey: "database"

api:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "api-b639884"
    pullPolicy: Always
  replicas: 2
  logLevel: "WARNING"
  debug: "false"
  corsOrigins: ""
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

worker:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "worker-b639884"
    pullPolicy: Always
  replicas: 1
  failureRate: "0.1"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

frontend:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "frontend-b639884"
    pullPolicy: Always
  replicas: 2
  # ClusterIP: external traffic enters through ALB Ingress, not directly to this Service.
  serviceType: ClusterIP
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

migration:
  backoffLimit: 3
