
# values-prod.yaml — AWS EKS production overrides
# Production uses Amazon RDS and AWS Secrets Manager.

components:
  mysql: false
  api: true
  worker: true
  frontend: true
  migration: false

mysql:
  enabled: false

db:
  host: "microtask-prod-mysql.cqpia4w42h8l.us-east-1.rds.amazonaws.com"
  port: 3306
  name: "microtask_db"
  user: "microtask_app"
  secretName: "microtask-db-secret"
  passwordKey: "password"
  usernameKey: "username"
  databaseKey: "database"

api:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "api-b639884"
    pullPolicy: Always
  replicas: 2
  logLevel: "WARNING"
  debug: "false"
  corsOrigins: ""
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

worker:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "worker-b639884"
    pullPolicy: Always
  replicas: 1
  failureRate: "0.1"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

frontend:
  image:
    repository: 893677555033.dkr.ecr.us-east-1.amazonaws.com/microtask-app
    tag: "frontend-b639884"
    pullPolicy: Always
  replicas: 2
  serviceType: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

migration:
  backoffLimit: 3
