# values-prod.yaml — AWS EKS production overrides
# Usage: helm upgrade --install microtask ./helm/microtask -n production -f helm/microtask/values-prod.yaml
#
# SECURITY RULES:
#   - No passwords are stored in this file.
#   - The Secret "microtask-db-secret" is created by External Secrets Operator
#     pulling credentials from AWS Secrets Manager. It must exist before install.
#   - Image tags must be pinned — never use "latest" in production.

# Disable in-cluster MySQL — production uses Amazon RDS
mysql:
  enabled: false

# External RDS connection details (no password — comes from ESO Secret)
db:
  host: "microtask-db.REPLACE_WITH_RDS_ENDPOINT.rds.amazonaws.com"
  port: 3306
  name: "microtask_db"
  user: "microtask_user"
  # This Secret is created by External Secrets Operator from AWS Secrets Manager.
  # It must be present in the namespace before helm install/upgrade.
  secretName: "microtask-db-secret"
  passwordKey: "password"
  usernameKey: "username"
  databaseKey: "database"

api:
  image:
    repository: REPLACE_WITH_ECR_ACCOUNT_ID.dkr.ecr.REPLACE_WITH_REGION.amazonaws.com/microtask-api
    tag: "1.0.0"
    pullPolicy: Always
  replicas: 2
  logLevel: "WARNING"
  debug: "false"
  corsOrigins: "https://REPLACE_WITH_YOUR_DOMAIN"
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

worker:
  image:
    repository: REPLACE_WITH_ECR_ACCOUNT_ID.dkr.ecr.REPLACE_WITH_REGION.amazonaws.com/microtask-worker
    tag: "1.0.0"
    pullPolicy: Always
  replicas: 1
  failureRate: "0.1"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

frontend:
  image:
    repository: REPLACE_WITH_ECR_ACCOUNT_ID.dkr.ecr.REPLACE_WITH_REGION.amazonaws.com/microtask-frontend
    tag: "1.0.0"
    pullPolicy: Always
  replicas: 2
  # LoadBalancer provisions an AWS ALB/NLB automatically on EKS
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

migration:
  backoffLimit: 3
